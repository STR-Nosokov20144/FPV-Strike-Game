name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Принудительно ставим самые свежие версии, которые требует GitHub
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Game
        run: |
          # Создаем чистый проект Cordova
          cordova create app com.mygame.fpvstrike "FPV Strike"
          cd app
          cordova platform add android
          
          # Намертво вырезаем дефолтного робота и заставки
          rm -rf www/*
          
          # Копируем ТВОИ файлы игры из корня репозитория прямо в Cordova
          cp ../index.html ./www/ || true
          cp -r ../css ./www/ || true
          cp -r ../js ./www/ || true
          
          # Переносим иконку, если она есть
          if [ -f ../icon.png ]; then
            cp ../icon.png ./icon.png
          fi
          
          # Создаем самый простой, чистый конфиг без плагинов заставок
          echo '<widget id="com.mygame.fpvstrike" version="1.0.0" xmlns="http://w3.org">' > config.xml
          echo '  <name>FPV Strike</name>' >> config.xml
          echo '  <content src="index.html" />' >> config.xml
          echo '  <preference name="Orientation" value="landscape" />' >> config.xml
          if [ -f ./icon.png ]; then
            echo '  <icon src="icon.png" />' >> config.xml
          fi
          echo '</widget>' >> config.xml
          
          # Финальная чистая сборка
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPV-Strike-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
