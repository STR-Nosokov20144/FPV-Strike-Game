name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Build Game
        run: |
          # 1. Создаем проект Cordova
          cordova create app com.mygame.fpvstrike "FPV Strike"
          cd app
          cordova platform add android
          
          # Намертво чистим дефолтный шаблон
          rm -rf www/*
          
          # 2. УМНЫЙ ПОИСК: ищем, в какой именно папке на GitHub лежит твой index.html
          # (игнорируем папку самого приложения 'app', которую мы только что создали)
          REAL_GAME_DIR=$(find .. -name "index.html" ! -path "*/app/*" -exec dirname {} \; | head -n 1)
          
          echo "Твоя игра найдена в папке: $REAL_GAME_DIR"
          
          # Насильно копируем абсолютно ВСЁ из папки с твоей игрой в сборку
          cp -r $REAL_GAME_DIR/* ./www/
          
          # 3. Переносим иконку из корня репозитория или из папки с игрой
          if [ -f ../icon.png ]; then
            cp ../icon.png ./icon.png
          elif [ -f $REAL_GAME_DIR/icon.png ]; then
            cp $REAL_GAME_DIR/icon.png ./icon.png
          fi
          
          # 4. Создаем чистый конфигурационный файл
          echo '<widget id="com.mygame.fpvstrike" version="1.0.0" xmlns="http://w3.org">' > config.xml
          echo '  <name>FPV Strike</name>' >> config.xml
          echo '  <content src="index.html" />' >> config.xml
          echo '  <preference name="Orientation" value="landscape" />' >> config.xml
          if [ -f ./icon.png ]; then
            echo '  <icon src="icon.png" />' >> config.xml
          fi
          echo '</widget>' >> config.xml
          
          # 5. Принудительно дублируем файлы в ассеты платформы, чтобы Android их точно сожрал
          cordova prepare android
          TARGET_ASSETS="platforms/android/app/src/main/assets/www"
          rm -rf $TARGET_ASSETS/*
          cp -r ./www/* $TARGET_ASSETS/
          
          # Финальная сборка
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPV-Strike-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
