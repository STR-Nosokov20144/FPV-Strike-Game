name: Build APK
on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          # 1. Создаем проект Cordova
          cordova create app com.mycompany.mygame "FPV Strike"
          cd app
          cordova platform add android
          
          # 2. Настраиваем конфиг (иконка, ландшафт, отключение сплэшскрина)
          if [ -f ../icon.png ]; then
            cp ../icon.png ./icon.png
            echo '<widget id="com.mycompany.mygame" version="1.0.0" xmlns="http://w3.org" xmlns:cdv="http://apache.org">' > config.xml
            echo '  <name>FPV Strike</name>' >> config.xml
            echo '  <description>FPV Strike Game</description>' >> config.xml
            echo '  <author email="dev@mycompany.com" href="http://mycompany.com">Developer</author>' >> config.xml
            echo '  <content src="index.html" />' >> config.xml
            echo '  <icon src="icon.png" />' >> config.xml
            echo '  <preference name="Orientation" value="landscape" />' >> config.xml
            echo '  <preference name="SplashScreen" value="none" />' >> config.xml
            echo '  <preference name="AutoHideSplashScreen" value="true" />' >> config.xml
            echo '  <preference name="ShowSplashScreenSpinner" value="false" />' >> config.xml
            echo '</widget>' >> config.xml
          fi
          
          # 3. Умный поиск папки с игрой
          GAME_DIR=$(find .. -name "index.html" ! -path "*/app/*" -exec dirname {} \; | head -n 1)
          
          # Очищаем дефолтный шаблон Cordova
          rm -rf www/*
          
          # Копируем всё содержимое из папки с твоей игрой в проект
          cp -r $GAME_DIR/* ./www/
          
          # Синхронизируем платформу Android
          cordova prepare android
          
          # Принудительно дублируем файлы в финальные ассеты Android
          TARGET_DIR="platforms/android/app/src/main/assets/www"
          rm -rf $TARGET_DIR/*
          cp -r ./www/* $TARGET_DIR/
          
          # Собираем финальный APK
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FPV-Strike-APK
          path: app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
